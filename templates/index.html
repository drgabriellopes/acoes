<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ════════════════════════════════════════════
// SYNAPSE COLOSSEUM v1.1 — Standalone Build
// ════════════════════════════════════════════

// ── Inline SVG Icons (replacing lucide-react) ──
const sz=(s)=>({width:s||16,height:s||16,viewBox:“0 0 24 24”,fill:“none”,stroke:“currentColor”,strokeWidth:2,strokeLinecap:“round”,strokeLinejoin:“round”});
const Icon=({d,size,className})=><svg {…sz(size)} className={className}><path d={d}/></svg>;
const Ic={
play:     (p)=><svg {…sz(p.size)} className={p.className}><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>,
square:   (p)=><Icon d=“M3 3h18v18H3z” {…p}/>,

check:    (p)=><Icon d=“M20 6L9 17l-5-5” {…p}/>,

refresh:  (p)=><svg {…sz(p.size)} className={p.className}><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>,

eyeOff:   (p)=><svg {…sz(p.size)} className={p.className}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
zap:      (p)=><svg {…sz(p.size)} className={p.className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor" stroke="none"/></svg>,
alert:    (p)=><svg {…sz(p.size)} className={p.className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
shield:   (p)=><Icon d=“M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z” {…p}/>,
chevDown: (p)=><Icon d=“M6 9l6 6 6-6” {…p}/>,
};

// ── Config ──
const API=“https://openrouter.ai/api/v1”;
const PRESETS={
brief:  {label:“Breve”, sub:“Direto ao ponto”,brainstorm:300, debate:450, comp:1000,bullets:6},
medium: {label:“Médio”, sub:“Equilibrado”,    brainstorm:600, debate:800, comp:1500,bullets:10},
long:   {label:“Longo”, sub:“Aprofundado”,    brainstorm:1200,debate:1600,comp:2000,bullets:14},
};
const PCOLORS={anthropic:”#D4A574”,openai:”#10a37f”,google:”#4285F4”,deepseek:”#4D6BFE”,“x-ai”:”#1DA1F2”,“meta-llama”:”#0668E1”,mistralai:”#FF7000”,qwen:”#6F42C1”,perplexity:”#20B2AA”,minimax:”#FF6B6B”,nvidia:”#76B900”,cohere:”#39594D”};
const CURATED=[
{id:“anthropic/claude-sonnet-4.6”,name:“Claude Sonnet 4.6”,input:3,output:15,reasoning:true},
{id:“anthropic/claude-opus-4.6”,name:“Claude Opus 4.6”,input:5,output:25,reasoning:true},
{id:“anthropic/claude-haiku-4.5”,name:“Claude Haiku 4.5”,input:1,output:5,reasoning:true},
{id:“openai/gpt-4o”,name:“GPT-4o”,input:2.5,output:10,reasoning:false},
{id:“openai/gpt-4o-mini”,name:“GPT-4o Mini”,input:0.15,output:0.6,reasoning:false},
{id:“openai/o4-mini”,name:“o4-mini”,input:1.1,output:4.4,reasoning:true},
{id:“openai/o3-mini”,name:“o3-mini”,input:1.1,output:4.4,reasoning:true},
{id:“google/gemini-3.1-pro-preview”,name:“Gemini 3.1 Pro”,input:2,output:12,reasoning:true},
{id:“google/gemini-2.5-flash”,name:“Gemini 2.5 Flash”,input:0.3,output:2.5,reasoning:true},
{id:“google/gemini-2.5-pro-preview-05-06”,name:“Gemini 2.5 Pro”,input:1.25,output:10,reasoning:true},
{id:“deepseek/deepseek-r1”,name:“DeepSeek R1”,input:0.7,output:2.5,reasoning:true},
{id:“deepseek/deepseek-chat”,name:“DeepSeek V3”,input:0.32,output:0.89,reasoning:false},
{id:“x-ai/grok-3”,name:“Grok 3”,input:3,output:15,reasoning:false},
{id:“x-ai/grok-3-mini”,name:“Grok 3 Mini”,input:0.3,output:0.5,reasoning:true},
{id:“meta-llama/llama-4-maverick”,name:“Llama 4 Maverick”,input:0.15,output:0.6,reasoning:false},
{id:“meta-llama/llama-4-scout”,name:“Llama 4 Scout”,input:0.08,output:0.3,reasoning:false},
{id:“mistralai/mistral-small-2603”,name:“Mistral Small 4”,input:0.15,output:0.6,reasoning:false},
{id:“qwen/qwen3.5-plus-02-15”,name:“Qwen 3.5 Plus”,input:0.26,output:1.56,reasoning:true},
{id:“perplexity/sonar-pro”,name:“Sonar Pro”,input:3,output:15,reasoning:false},
{id:“minimax/minimax-m2.5”,name:“MiniMax M2.5”,input:0.2,output:1.17,reasoning:true},
].map(m=>({…m,provider:m.id.split(”/”)[0],params:[],context:128000,maxOut:16384}));
const COMP_MODEL=“openai/gpt-4o-mini”;

// ── Storage (localStorage) ──
const S={
get(k){try{const v=localStorage.getItem(“sc_”+k);return v?JSON.parse(v):null}catch{return null}},
set(k,v){try{localStorage.setItem(“sc_”+k,JSON.stringify(v))}catch{}},
del(k){try{localStorage.removeItem(“sc_”+k)}catch{}},
};

// ── Logger (localStorage) ──
const Log={
_c:null,
_load(){if(this._c)return this._c;this._c=S.get(“logs”)||[];return this._c},
add(lv,src,msg,det){
const l=this._load();
l.push({ts:new Date().toISOString(),level:lv,source:src,message:String(msg).slice(0,500),detail:det?String(typeof det===“object”?JSON.stringify(det):det).slice(0,1000):null});
while(l.length>200)l.shift();
this._c=l;S.set(“logs”,l);
},
error(s,m,d){this.add(“error”,s,m,d)},
warn(s,m,d){this.add(“warn”,s,m,d)},
info(s,m,d){this.add(“info”,s,m,d)},
all(){return this._load().slice().reverse()},
clear(){this._c=[];S.set(“logs”,[])},
};

// ── SSE Parser ──
async function* sse(res){
const reader=res.body.getReader(),dec=new TextDecoder();
let buf=””;
try{
while(true){
const{done,value}=await reader.read();
if(done)break;
buf+=dec.decode(value,{stream:true});
const lines=buf.split(”\n”);buf=lines.pop()||””;
for(const l of lines){
if(!l||l.startsWith(”:”))continue;
if(l.startsWith(“data: “)){
const d=l.slice(6).trim();
if(d===”[DONE]”)return;
try{yield JSON.parse(d)}catch{}
}
}
}
}finally{reader.releaseLock()}
}

// ── API ──
async function loadModels(key){
Log.info(“connect”,“Fetching models from OpenRouter”);
const r=await fetch(`${API}/models`,{headers:key?{Authorization:`Bearer ${key}`}:{}});
if(!r.ok){const b=await r.text().catch(()=>””);Log.error(“connect”,`Models HTTP ${r.status}`,b.slice(0,500));throw new Error(`HTTP ${r.status}`)}
const d=await r.json();
const models=d.data
.filter(m=>m.architecture?.output_modalities?.includes(“text”))
.map(m=>({id:m.id,name:m.name||m.id,provider:m.id.split(”/”)[0],
input:parseFloat(m.pricing?.prompt||“0”)*1e6,output:parseFloat(m.pricing?.completion||“0”)*1e6,
rPrice:parseFloat(m.pricing?.internal_reasoning||“0”)*1e6,
reasoning:(m.supported_parameters||[]).includes(“reasoning”),
params:m.supported_parameters||[],context:m.context_length||128000,maxOut:m.top_provider?.max_completion_tokens||16384}))
.filter(m=>m.output>0||m.input>0).sort((a,b)=>a.output-b.output);
Log.info(“connect”,`Loaded ${models.length} models`);
return models;
}

function mkBody(model,msgs,maxTk){
const b={model:model.id,messages:msgs,max_tokens:maxTk,stream:true};
if(model.reasoning){b.reasoning=model.provider===“anthropic”?{max_tokens:Math.max(1024,Math.floor(maxTk*0.2))}:{effort:“low”}}
if(!(model.reasoning&&model.provider===“openai”))b.temperature=0.8;
return b;
}

async function streamOne(key,model,msgs,maxTk,onChunk,signal){
Log.info(“stream”,`Start: ${model.id}`);
const r=await fetch(`${API}/chat/completions`,{
method:“POST”,signal,
headers:{Authorization:`Bearer ${key}`,“Content-Type”:“application/json”,“HTTP-Referer”:“https://synapse-colosseum.app”,“X-Title”:“Synapse Colosseum”},
body:JSON.stringify(mkBody(model,msgs,maxTk)),
});
if(!r.ok){const e=await r.json().catch(()=>({}));const msg=e.error?.message||`HTTP ${r.status}`;Log.error(“stream”,`${model.id}: ${msg}`,{status:r.status,error:e.error});throw new Error(msg)}
let text=””,usage=null,fr=null;
for await(const c of sse(r)){
const dt=c.choices?.[0]?.delta;
if(dt?.content){text+=dt.content;onChunk(text,false)}
if(c.choices?.[0]?.finish_reason)fr=c.choices[0].finish_reason;
if(c.usage)usage=c.usage;
}
onChunk(text,true);
if(fr===“length”)Log.warn(“stream”,`${model.id}: Truncated`);
if(fr===“error”)Log.error(“stream”,`${model.id}: error finish_reason`);
Log.info(“stream”,`${model.id}: Done (${fr}, ${usage?.completion_tokens||"?"}tk)`);
return{text,usage,fr};
}

// ── Cost ──
function estRound(models,maxTk){return models.reduce((t,m)=>{const ic=(2500/1e6)*m.input;const oc=(maxTk/1e6)*m.output*(m.reasoning?2:1);return t+ic+oc},0)}
function realCost(u,m){if(!u)return 0;const ic=((u.prompt_tokens||0)/1e6)*m.input;const rt=u.completion_tokens_details?.reasoning_tokens||0;const vt=(u.completion_tokens||0)-rt;return ic+(vt/1e6)*m.output+(rt/1e6)*(m.rPrice||m.output)}

// ── Prompts ──
function sysPr(mode,name,rnd){
return mode===“brainstorm”
?`You are ${name}, in a collaborative brainstorming session (Round ${rnd}). Build upon ideas from others. Be creative, propose concrete solutions or new angles. Don't repeat what was said — add something new. Be concise.`
:`You are ${name}, in a competitive intellectual debate (Round ${rnd}). Defend your position rigorously. Challenge the premises and logic of opponents. Use evidence and reasoning. Be persuasive, fair, and concise.`;
}
function roundMsgs(mode,topic,name,rnd,prev,summary){
let u=`Topic: ${topic}`;
if(summary)u+=`\n\nSummary so far:\n${summary}`;
if(prev?.length){const o=prev.filter(r=>r.mn!==name).map(r=>`[${r.mn}]: ${r.text}`).join(”\n\n”);if(o)u+=`\n\nPrevious round:\n${o}`}
if(rnd>1)u+=mode===“brainstorm”?”\n\nBuild on what was said. Add a new angle.”:”\n\nRespond to the arguments. Defend or refine your position.”;
return[{role:“system”,content:sysPr(mode,name,rnd)},{role:“user”,content:u}];
}
function compPrompt(responses,preset){
const p=PRESETS[preset];const txt=responses.map(r=>`**${r.mn}:**\n${r.text}`).join(”\n\n—\n\n”);
return`Compress this discussion into at most ${p.bullets} bullet points.\n\nRules:\n- Keep only active positions and unresolved arguments\n- Discard refuted positions\n- Preserve factual claims and data\n- Note key disagreements\n- Be concise\n\nDISCUSSION:\n${txt}\n\nSUMMARY (${p.bullets} bullets max):`;
}

// ── Helpers ──
const pColor=(p)=>PCOLORS[p]||”#888”;
const fmtCost=(c)=>c<0.01?`$${(c*100).toFixed(2)}¢`:`$${c.toFixed(4)}`;
const pName=(p)=>({anthropic:“Anthropic”,openai:“OpenAI”,google:“Google”,deepseek:“DeepSeek”,“x-ai”:“xAI”,“meta-llama”:“Meta”,mistralai:“Mistral”,qwen:“Qwen”,perplexity:“Perplexity”,minimax:“MiniMax”,nvidia:“NVIDIA”})[p]||p;

// ════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════
function App(){
const[screen,setScreen]=useState(“setup”);
const[apiKey,setApiKey]=useState(””);
const[keyIn,setKeyIn]=useState(””);
const[showKey,setShowKey]=useState(false);
const[keyErr,setKeyErr]=useState(””);
const[keyLoad,setKeyLoad]=useState(false);
const[allModels,setAllModels]=useState([]);
const[selIds,setSelIds]=useState([]);
const[mLoad,setMLoad]=useState(false);
const[mSearch,setMSearch]=useState(””);
const[showAll,setShowAll]=useState(false);
const[mode,setMode]=useState(“debate”);
const[preset,setPreset]=useState(“medium”);
const[topic,setTopic]=useState(””);
const[nRounds,setNRounds]=useState(4);
const[running,setRunning]=useState(false);
const[curRound,setCurRound]=useState(0);
const[rounds,setRounds]=useState([]);
const[live,setLive]=useState({});
const[summary,setSummary]=useState(null);
const[compressing,setCompressing]=useState(false);
const[cost,setCost]=useState(0);
const[done,setDone]=useState(false);
const[viewRound,setViewRound]=useState(-1);
const[showLogs,setShowLogs]=useState(false);
const[logs,setLogs]=useState([]);
const abortRef=useRef(null);
const pendRef=useRef({});
const lastFlush=useRef(0);

const selModels=useMemo(()=>selIds.map(id=>allModels.find(m=>m.id===id)||CURATED.find(m=>m.id===id)).filter(Boolean),[selIds,allModels]);
const maxTk=useMemo(()=>{const p=PRESETS[preset];return p[mode]||p.brainstorm},[preset,mode]);
const estCost=useMemo(()=>selModels.length?estRound(selModels,maxTk)*nRounds+Math.floor(nRounds/2)*0.002:0,[selModels,maxTk,nRounds]);
const displayModels=useMemo(()=>{
let l=allModels.length>0?allModels:CURATED;
if(mSearch.trim()){const q=mSearch.toLowerCase();l=l.filter(m=>m.name.toLowerCase().includes(q)||m.id.toLowerCase().includes(q))}
if(!showAll&&!mSearch.trim())l=l.slice(0,24);return l;
},[allModels,mSearch,showAll]);
const usingCurated=allModels.length===0;

// ── Init ──
useEffect(()=>{
Log.info(“init”,“App starting”);
const k=S.get(“sk”),m=S.get(“ml”),s=S.get(“si”),mo=S.get(“mo”),pr=S.get(“pr”);
if(k){setApiKey(k);setScreen(“config”);Log.info(“init”,“Restored key”)}
if(m?.length){setAllModels(m);Log.info(“init”,`Restored ${m.length} models`)}
if(s?.length)setSelIds(s);
if(mo)setMode(mo);if(pr)setPreset(pr);
},[]);
useEffect(()=>{S.set(“si”,selIds)},[selIds]);
useEffect(()=>{S.set(“mo”,mode)},[mode]);
useEffect(()=>{S.set(“pr”,preset)},[preset]);

// ── Handlers ──
const connect=async()=>{
const k=keyIn.trim();if(!k)return;
setKeyLoad(true);setKeyErr(””);
Log.info(“connect”,`Connecting...`);
try{const models=await loadModels(k);setAllModels(models);S.set(“ml”,models.slice(0,120))}
catch(e){Log.warn(“connect”,`Model fetch failed: ${e.message}`);setAllModels([])}
setApiKey(k);S.set(“sk”,k);setScreen(“config”);setKeyLoad(false);
};
const refresh=async()=>{
setMLoad(true);Log.info(“refresh”,“Refreshing models”);
try{const m=await loadModels(apiKey);if(m.length){setAllModels(m);S.set(“ml”,m.slice(0,120))}}
catch(e){Log.error(“refresh”,e.message)}
setMLoad(false);
};
const toggle=(id)=>setSelIds(p=>p.includes(id)?p.filter(x=>x!==id):p.length<8?[…p,id]:p);
const disconnect=()=>{setApiKey(””);setKeyIn(””);S.del(“sk”);setScreen(“setup”)};
const openLogs=()=>{setLogs(Log.all());setShowLogs(true)};
const clearLogs=()=>{Log.clear();setLogs([])};

const flush=useCallback(()=>{
const now=Date.now();
if(Object.keys(pendRef.current).length&&(now-lastFlush.current>120)){
lastFlush.current=now;const u={…pendRef.current};pendRef.current={};setLive(p=>({…p,…u}));
}
},[]);
const upd=useCallback((id,text,dn,err)=>{
pendRef.current[id]={text,done:dn,error:err||null};
if(dn||err){const u={…pendRef.current};pendRef.current={};setLive(p=>({…p,…u}))}
else flush();
},[flush]);

// ── Arena ──
const runArena=async()=>{
if(selModels.length<2||!topic.trim())return;
setRunning(true);setDone(false);setRounds([]);setLive({});setSummary(null);setCost(0);setScreen(“arena”);setViewRound(-1);
const ctrl=new AbortController();abortRef.current=ctrl;
let curSum=null,compRnds=[],acc=0;
const iv=setInterval(flush,130);
Log.info(“arena”,`Start: ${mode}/${preset}, ${selModels.length} models, ${nRounds} rnd`,{topic:topic.slice(0,100),models:selModels.map(m=>m.id)});
try{
for(let rn=1;rn<=nRounds;rn++){
if(ctrl.signal.aborted)break;
setCurRound(rn);Log.info(“arena”,`Round ${rn}/${nRounds}`);
const prev=compRnds[compRnds.length-1]||null;
const initL={};selModels.forEach(m=>{initL[m.id]={text:””,done:false,error:null}});
setLive(initL);pendRef.current={};
const results=[];
for(let i=0;i<selModels.length;i+=4){
if(ctrl.signal.aborted)break;
const batch=selModels.slice(i,i+4);
const br=await Promise.allSettled(batch.map(async(model)=>{
const msgs=roundMsgs(mode,topic,model.name,rn,prev,curSum);
try{
const res=await streamOne(apiKey,model,msgs,maxTk,(t,d)=>upd(model.id,t,d),ctrl.signal);
const c=realCost(res.usage,model);acc+=c;setCost(acc);
return{mid:model.id,mn:model.name,text:res.text,usage:res.usage,fr:res.fr,cost:c};
}catch(e){
if(e.name===“AbortError”)throw e;
Log.error(“arena”,`${model.id} R${rn}: ${e.message}`);
upd(model.id,””,true,e.message);
return{mid:model.id,mn:model.name,text:””,error:e.message,cost:0};
}
}));
br.forEach(r=>{if(r.status===“fulfilled”)results.push(r.value)});
}
compRnds.push(results);setRounds([…compRnds]);
const finalL={};results.forEach(r=>{finalL[r.mid]={text:r.text,done:true,error:r.error||null}});
setLive(p=>({…p,…finalL}));
// Compress
if(rn%2===0&&rn<nRounds&&!ctrl.signal.aborted){
setCompressing(true);
Log.info(“compress”,`Compressing R${rn-1}-${rn}`);
try{
const toC=compRnds.slice(-2).flat().filter(r=>r.text);
const cr=await fetch(`${API}/chat/completions`,{
method:“POST”,signal:ctrl.signal,
headers:{Authorization:`Bearer ${apiKey}`,“Content-Type”:“application/json”},
body:JSON.stringify({model:COMP_MODEL,messages:[{role:“user”,content:compPrompt(toC,preset)}],max_tokens:PRESETS[preset].comp,temperature:0.3}),
});
if(cr.ok){
const cd=await cr.json();const ct=cd.choices?.[0]?.message?.content||””;
curSum=ct;setSummary(ct);
if(cd.usage){acc+=((cd.usage.prompt_tokens||0)*0.15+(cd.usage.completion_tokens||0)*0.6)/1e6;setCost(acc)}
Log.info(“compress”,`Done: ${ct.length} chars`);
}else{Log.error(“compress”,`HTTP ${cr.status}`)}
}catch(e){if(e.name!==“AbortError”)Log.error(“compress”,e.message)}
setCompressing(false);
}
if(rn<nRounds&&!ctrl.signal.aborted)await new Promise(r=>setTimeout(r,800));
}
}catch(e){if(e.name!==“AbortError”)Log.error(“arena”,`Crash: ${e.message}`)}
clearInterval(iv);setRunning(false);setDone(true);abortRef.current=null;
Log.info(“arena”,`Finished. Cost: $${acc.toFixed(6)}`);
};
